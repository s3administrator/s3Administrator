services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-DEV}
      - DATABASE_URL=postgresql://s3admin:${POSTGRES_PASSWORD}@db:5432/s3_admin
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL:-http://localhost}
      # OAuth — pass both _DEV and _PROD; the app resolves based on ENVIRONMENT
      - GITHUB_CLIENT_ID_DEV=${GITHUB_CLIENT_ID_DEV}
      - GITHUB_CLIENT_SECRET_DEV=${GITHUB_CLIENT_SECRET_DEV}
      - GITHUB_CLIENT_ID_PROD=${GITHUB_CLIENT_ID_PROD}
      - GITHUB_CLIENT_SECRET_PROD=${GITHUB_CLIENT_SECRET_PROD}
      - GOOGLE_CLIENT_ID_DEV=${GOOGLE_CLIENT_ID_DEV}
      - GOOGLE_CLIENT_SECRET_DEV=${GOOGLE_CLIENT_SECRET_DEV}
      - GOOGLE_CLIENT_ID_PROD=${GOOGLE_CLIENT_ID_PROD}
      - GOOGLE_CLIENT_SECRET_PROD=${GOOGLE_CLIENT_SECRET_PROD}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - ENCRYPTION_SALT=${ENCRYPTION_SALT}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-www.s3administrator.com}
    volumes:
      - ./${CADDYFILE:-Caddyfile.local}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=s3admin
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=s3_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s3admin -d s3_admin"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
